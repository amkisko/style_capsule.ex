name: test

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  coverage:
    runs-on: ubuntu-latest
    env:
      ELIXIR_VERSION: "1.18"
      OTP_VERSION: "27"
      MIX_ENV: test
      CI: true
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - name: Restore Mix/Hex/Rebar cache
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
            ~/.mix
            ~/.hex
            ~/.cache/rebar3
          key: ${{ runner.os }}-beam-${{ env.OTP_VERSION }}-ex${{ env.ELIXIR_VERSION }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-beam-${{ env.OTP_VERSION }}-ex${{ env.ELIXIR_VERSION }}-mix-
            ${{ runner.os }}-beam-${{ env.OTP_VERSION }}-ex${{ env.ELIXIR_VERSION }}-
            ${{ runner.os }}-beam-
      - run: mix deps.get
      - run: mix deps.compile
      - run: mix coveralls.json
      - uses: codecov/codecov-action@v7
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./cover/excoveralls.json
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
      - uses: codecov/codecov-action@v7
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: coverage/junit-coverage.xml
